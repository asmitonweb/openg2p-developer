# Render every registry from the pinned charts and check the result:
# compose files validate, no private host or image leaks into them, and every referenced image
# is either a local build target (oan/*:local) or publicly pullable.
name: Validate rendered stack

on:
  pull_request:
  push:
    branches: [oan-developer]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render every component (commons + registries, services, dashboards)
        # OAN images as local build targets: the check below verifies the published ones separately.
        env:
          OAN_IMAGE_PREFIX: oan
          OAN_IMAGE_TAG: local
        run: scripts/render.sh farmer crop live da aggregation-api consent-partner-portal farmer-dashboard crop-dashboard live-dashboard
      - name: Every OAN image is published on GHCR
        # ghcr.io/asmitonweb/<product>/<role>:latest for every role of every component that ships
        # an image (built by the fork mirror workflows; a missing one means a fork is not set up).
        run: |
          source scripts/components.sh
          fail=0
          for id in $(comp_ids); do
            product=$(comp_field "$id" 8); [ "$product" != - ] || continue
            for role in $(comp_roles "$id"); do
              img="ghcr.io/asmitonweb/$product/$role:latest"
              docker manifest inspect "$img" >/dev/null 2>&1 && echo "ok  $img" || { echo "MISSING $img"; fail=1; }
            done
          done
          exit $fail
      - name: Compose files validate
        env:
          COMPOSE_PROFILES: '*'
        run: |
          fail=0
          for ns in commons farmer crop live; do
            files=(-f out/$ns/compose.yaml); [ -f overrides/$ns.yaml ] && files+=(-f overrides/$ns.yaml)
            if docker compose "${files[@]}" config -q; then echo "$ns ok"; else echo "$ns INVALID"; fail=1; fi
          done
          exit $fail
      - name: No registry seed loads sample data or images
        # The crop and livestock seed images ship no loader for either (the entrypoint exits 1), and
        # the farmer loader is rejected by attribute validation; see docs/registries.md.
        run: |
          ! grep -rnE "LOAD_(SAMPLE_DATA|IMAGES): '?true" out/*/compose.yaml
      - name: No private hosts or registries in the compose projects
        run: |
          ! grep -rE 'oanstaging\.com|dkr\.ecr\.|istio-system' out/*/compose.yaml out/files
      - name: Every image is a local build target or publicly pullable
        env:
          COMPOSE_PROFILES: '*'
        run: |
          fail=0
          while read -r img; do
            case "$img" in oan/*:local) continue ;; esac
            docker manifest inspect "$img" >/dev/null 2>&1 || { echo "not pullable: $img"; fail=1; }
          done < <(for ns in commons farmer crop live; do docker compose -f out/$ns/compose.yaml config --images; done | sort -u)
          exit $fail
      - name: Report
        if: always()
        run: cat out/REPORT.md
