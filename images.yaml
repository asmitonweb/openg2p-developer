# Image rewrites applied while translating the rendered charts to Compose (scripts/gen.py).
#
# The COSS charts pin images in a private AWS ECR registry that developers cannot pull.
# Rules here are tried first (regex -> replacement, Python re syntax). Any other ECR image
# is then mapped generically to  $OAN_IMAGE_PREFIX/<product>/<role>:<tag>  with the digest
# dropped, so the same compose can point at GHCR (pull) or at local builds (oan.sh build).
#
# No rule is needed today: every private image of the COSS charts has a component in
# scripts/components.sh, and its fork mirror workflow publishes ghcr.io/asmitonweb/<product>/<role>
# (see docs/images-and-seed-data.md). Add a rule here only for an image nobody builds.
rewrites: []
